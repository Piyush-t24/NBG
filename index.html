<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBG - NEET Battleground</title>
    <meta name="description" content="Interactive learning platform for NEET preparation with MCQ quizzes and drawing games" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="NEET Battleground" />
    <meta property="og:description" content="Master NEET concepts through interactive multiplayer battles" />

    <meta property="og:url" content="https://your-domain.vercel.app" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://your-domain.vercel.app/og-image.png" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
